<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>StandBook</title>

  <style>

    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --surface-soft: #f1f2ee;

      --text: #1f2521;
      --muted: #6f776f;

      --green: #244b39;
      --green-dark: #19382a;
      --green-soft: #e7efe9;

      --border: #dddeda;

      --warning-bg: #fff5dc;
      --warning-text: #8a6100;

      --full-bg: #eceeeb;
      --full-text: #686f69;

      --shadow:
        0 18px 50px rgba(39, 49, 41, 0.08);

      --modal-shadow:
        0 28px 80px rgba(17, 25, 20, 0.28);

      --radius-xl: 26px;
      --radius-lg: 19px;
      --radius-md: 13px;
    }


    * {
      box-sizing: border-box;
    }
    
  [hidden] {
  display: none !important;
}

    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          rgba(36, 75, 57, 0.09),
          transparent 34rem
        ),
        var(--bg);
    }


    body.modal-open {
      overflow: hidden;
    }


    button,
    input {
      font: inherit;
    }


    a {
      color: inherit;
    }


    .page-shell {
      width: min(
        760px,
        calc(100% - 28px)
      );

      margin: 0 auto;
      padding: 46px 0 72px;
    }


    /* =====================================
       BRAND
    ===================================== */

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 34px;

      color: var(--green);

      font-weight: 800;
      letter-spacing: -0.02em;
    }


    .brand-mark {
      display: grid;
      place-items: center;

      width: 34px;
      height: 34px;

      border-radius: 10px;

      color: white;
      background: var(--green);

      font-size: 0.95rem;
    }


    /* =====================================
       HERO
    ===================================== */

    .hero {
      margin-bottom: 30px;
    }


    .hero-label {
      margin: 0 0 10px;

      color: var(--green);

      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;

      text-transform: uppercase;
    }


    .hero h1 {
      margin: 0;

      max-width: 700px;

      font-size: clamp(
        2.25rem,
        8vw,
        4rem
      );

      line-height: 1.01;
      letter-spacing: -0.055em;
    }


    .hero-description {
      max-width: 620px;

      margin: 20px 0 0;

      color: var(--muted);

      font-size: 1.03rem;
      line-height: 1.7;
    }


    /* =====================================
       BOOKING SHELL
    ===================================== */

    .booking-shell {
      padding: 22px;

      border: 1px solid
        rgba(221, 222, 218, 0.9);

      border-radius: var(--radius-xl);

      background:
        rgba(255, 255, 255, 0.86);

      box-shadow: var(--shadow);

      backdrop-filter: blur(10px);
    }


    .booking-heading {
      margin-bottom: 20px;
    }


    .booking-heading p {
      margin: 0 0 5px;

      color: var(--muted);

      font-size: 0.83rem;
      font-weight: 700;
    }


    .booking-heading h2 {
      margin: 0;

      font-size: 1.45rem;
      letter-spacing: -0.025em;
    }


    /* =====================================
       DAY TABS
    ===================================== */

    .day-tabs {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(140px, 1fr)
        );

      gap: 8px;

      margin-bottom: 24px;
      padding: 6px;

      border-radius: 16px;

      background: var(--surface-soft);
    }


    .day-tab {
      border: 0;
      padding: 12px 14px;

      border-radius: 12px;

      color: var(--muted);
      background: transparent;

      cursor: pointer;

      text-align: left;
    }


    .day-tab.active {
      color: var(--text);
      background: white;

      box-shadow:
        0 5px 17px
        rgba(39, 49, 41, 0.08);
    }


    .day-tab span,
    .day-tab strong {
      display: block;
    }


    .day-tab span {
      margin-bottom: 2px;

      font-size: 0.76rem;
    }


    .day-tab strong {
      font-size: 0.95rem;
    }


    /* =====================================
       TIME
    ===================================== */

    .time-group {
      margin-top: 24px;
    }


    .time-group:first-child {
      margin-top: 0;
    }


    .time-heading {
      margin: 0 0 10px;

      font-size: 1.06rem;
      letter-spacing: -0.015em;
    }


    /* =====================================
       STAND CARD
    ===================================== */

    .stand-card {
      padding: 18px;
      margin-bottom: 11px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background: var(--surface);

      transition:
        transform 140ms ease,
        box-shadow 140ms ease;
    }


    .stand-card:not(.stand-card-full):hover {
      transform: translateY(-1px);

      box-shadow:
        0 12px 26px
        rgba(39, 49, 41, 0.055);
    }


    .stand-card-full {
      background: #f7f7f5;
    }


    .stand-top {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 14px;

      margin-bottom: 14px;
    }


    .stand-title {
      margin: 0 0 4px;

      font-size: 1.07rem;
    }


    .stand-address {
      margin: 0;

      color: var(--muted);

      font-size: 0.89rem;
      line-height: 1.45;
    }


    .map-link {
      display: inline-flex;

      margin-top: 7px;

      color: var(--green);

      font-size: 0.84rem;
      font-weight: 750;

      text-decoration: none;
    }


    .map-link:hover {
      text-decoration: underline;
    }


    /* =====================================
       STATUS
    ===================================== */

    .status {
      flex: 0 0 auto;

      display: inline-flex;
      align-items: center;

      min-height: 27px;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 0.72rem;
      font-weight: 800;

      white-space: nowrap;
    }


    .status.open {
      color: #17633f;
      background: var(--green-soft);
    }


    .status.partial {
      color: var(--warning-text);
      background: var(--warning-bg);
    }


    .status.full,
    .status.closed {
      color: var(--full-text);
      background: var(--full-bg);
    }


    /* =====================================
       PERSON SLOTS
    ===================================== */

    .people {
      display: grid;
      gap: 7px;

      margin-top: 13px;
    }


    .person {
      display: flex;
      align-items: center;

      min-height: 43px;

      padding: 10px 12px;

      border-radius: var(--radius-md);

      background: var(--surface-soft);

      font-size: 0.93rem;
      font-weight: 650;
    }


    .person::before {
      content: "✓";

      display: grid;
      place-items: center;

      width: 20px;
      height: 20px;

      margin-right: 9px;

      border-radius: 50%;

      color: white;
      background: var(--green);

      font-size: 0.68rem;
    }


    .person.empty {
      border: 1px dashed #cbd0ca;

      color: #7f867f;
      background: transparent;

      font-weight: 550;
    }


    .person.empty::before {
      content: "";

      width: 18px;
      height: 18px;

      border: 1px dashed #b8beb7;

      background: transparent;
    }


    /* =====================================
       BUTTONS
    ===================================== */

    .book-button,
    .primary-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 47px;

      padding: 11px 18px;

      border: 1px solid var(--green);
      border-radius: 12px;

      color: white;
      background: var(--green);

      font-weight: 800;

      cursor: pointer;
    }


    .book-button {
      margin-top: 14px;
    }


    .book-button:hover,
    .primary-button:hover {
      background: var(--green-dark);
    }


    .book-button:disabled,
    .primary-button:disabled {
      cursor: not-allowed;

      border-color: #b8bdb8;
      background: #b8bdb8;
    }


    .secondary-button {
      width: 100%;
      min-height: 45px;

      padding: 10px 16px;

      border: 1px solid var(--border);
      border-radius: 12px;

      color: var(--text);
      background: white;

      font-weight: 750;

      cursor: pointer;
    }


    /* =====================================
       MODAL
    ===================================== */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: grid;
      place-items: center;

      padding: 18px;

      background:
        rgba(20, 28, 23, 0.56);

      backdrop-filter: blur(5px);

      opacity: 1;

      transition: opacity 160ms ease;
    }


    .modal-backdrop[hidden] {
      display: none;
    }


    .modal-card {
      position: relative;

      width: min(100%, 480px);

      max-height: calc(100vh - 36px);
      overflow-y: auto;

      padding: 27px;

      border: 1px solid
        rgba(255, 255, 255, 0.6);

      border-radius: 24px;

      background: white;

      box-shadow: var(--modal-shadow);

      animation:
        modalIn 180ms ease-out;
    }


    @keyframes modalIn {

      from {
        opacity: 0;

        transform:
          translateY(12px)
          scale(0.985);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    .modal-close {
      position: absolute;

      top: 17px;
      right: 17px;

      display: grid;
      place-items: center;

      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 50%;

      color: var(--muted);
      background: var(--surface-soft);

      font-size: 1.25rem;

      cursor: pointer;
    }


    .modal-label {
      margin: 0 45px 7px 0;

      color: var(--green);

      font-size: 0.75rem;
      font-weight: 850;
      letter-spacing: 0.07em;

      text-transform: uppercase;
    }


    .modal-card h2 {
      margin: 0 45px 7px 0;

      font-size: 1.65rem;
      letter-spacing: -0.035em;
    }


    .modal-stand {
      margin: 0;

      font-weight: 750;
    }


    .modal-address {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 0.9rem;
    }


    .modal-divider {
      height: 1px;

      margin: 22px 0;

      background: var(--border);
    }


    /* =====================================
       FORM
    ===================================== */

    .field {
      display: block;

      margin-bottom: 17px;
    }


    .field-label {
      display: block;

      margin-bottom: 7px;

      font-size: 0.86rem;
      font-weight: 750;
    }


    .text-input {
      width: 100%;

      min-height: 48px;

      padding: 11px 13px;

      border: 1px solid #cfd3ce;
      border-radius: 12px;

      color: var(--text);
      background: white;

      outline: none;
    }


    .text-input:focus {
      border-color: var(--green);

      box-shadow:
        0 0 0 3px
        rgba(36, 75, 57, 0.10);
    }


    .partner-option {
      display: flex;

      align-items: flex-start;

      gap: 10px;

      margin: 5px 0 18px;

      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 12px;

      cursor: pointer;
    }


    .partner-option input {
      width: 18px;
      height: 18px;

      margin: 1px 0 0;

      accent-color: var(--green);
    }


    .partner-option strong {
      display: block;

      margin-bottom: 2px;

      font-size: 0.9rem;
    }


    .partner-option span {
      display: block;

      color: var(--muted);

      font-size: 0.78rem;
      line-height: 1.4;
    }


    .form-error {
      min-height: 20px;

      margin: 0 0 12px;

      color: #a02923;

      font-size: 0.84rem;
      font-weight: 650;
    }


    /* =====================================
       SUCCESS TOAST
    ===================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 24px;

      z-index: 1200;

      transform:
        translateX(-50%);

      width:
        min(
          calc(100% - 32px),
          420px
        );

      padding: 14px 18px;

      border-radius: 14px;

      color: white;
      background: var(--green);

      box-shadow:
        0 14px 40px
        rgba(20, 40, 30, 0.25);

      font-weight: 750;

      text-align: center;
    }


    .toast[hidden] {
      display: none;
    }


    /* =====================================
       STATE
    ===================================== */

    .state-message {
      padding: 28px 2px;

      color: var(--muted);
    }


    .error {
      color: #a02923;
    }


    .footer-note {
      margin: 26px 0 0;

      color: var(--muted);

      font-size: 0.78rem;
      line-height: 1.55;

      text-align: center;
    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

      .page-shell {
        width: min(
          100% - 18px,
          760px
        );

        padding: 28px 0 46px;
      }


      .brand {
        margin-left: 4px;
        margin-bottom: 26px;
      }


      .hero {
        padding: 0 4px;
        margin-bottom: 24px;
      }


      .hero h1 {
        font-size: clamp(
          2.1rem,
          12vw,
          3.2rem
        );
      }


      .booking-shell {
        padding: 15px;

        border-radius: 21px;
      }


      .stand-card {
        padding: 16px;
      }


      .modal-card {
        padding: 23px 19px;

        border-radius: 21px;
      }

    }

  </style>
</head>


<body>

  <div class="page-shell">

    <div class="brand">

      <div class="brand-mark">
        S
      </div>

      <span>
        StandBook
      </span>

    </div>


    <p
      id="loading"
      class="state-message"
    >
      Henter arrangement...
    </p>


    <p
      id="error-message"
      class="state-message error"
      hidden
    ></p>


    <main
      id="page"
      hidden
    >

      <header class="hero">

        <p class="hero-label">
          Standbooking
        </p>

        <h1 id="event-title"></h1>

        <p
          id="event-description"
          class="hero-description"
        ></p>

      </header>


      <section class="booking-shell">

        <div class="booking-heading">

          <p>
            Vagtplan
          </p>

          <h2>
            Vælg et tidspunkt
          </h2>

        </div>


        <nav
          id="day-tabs"
          class="day-tabs"
          aria-label="Vælg dag"
        ></nav>


        <section
          id="schedule"
        ></section>

      </section>


      <p class="footer-note">
        Dit navn bliver synligt for andre,
        der har adgang til bookinglinket.
        Kontakt arrangøren, hvis din booking
        skal ændres eller slettes.
      </p>

    </main>

  </div>



  <!-- =====================================
       BOOKING MODAL
  ====================================== -->

  <div
    id="booking-modal"
    class="modal-backdrop"
    hidden
  >

    <section
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >

      <button
        id="modal-close"
        class="modal-close"
        type="button"
        aria-label="Luk"
      >
        ×
      </button>


      <p class="modal-label">
        Book vagt
      </p>


      <h2 id="modal-title">
        12.00–13.00
      </h2>


      <p
        id="modal-stand"
        class="modal-stand"
      ></p>


      <p
        id="modal-address"
        class="modal-address"
      ></p>


      <a
        id="modal-map"
        class="map-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Se på kort ↗
      </a>


      <div class="modal-divider"></div>


      <form id="booking-form">

        <label class="field">

          <span class="field-label">
            Dit navn
          </span>

          <input
            id="first-name"
            class="text-input"
            type="text"
            maxlength="100"
            autocomplete="name"
            required
            placeholder="Skriv dit navn"
          >

        </label>


        <label
          id="partner-option"
          class="partner-option"
        >

          <input
            id="book-both"
            type="checkbox"
          >

          <span>

            <strong>
              Jeg har en makker med
            </strong>

            <span>
              Book begge ledige pladser på denne vagt.
            </span>

          </span>

        </label>


        <label
          id="second-name-field"
          class="field"
          hidden
        >

          <span class="field-label">
            Din makkers navn
          </span>

          <input
            id="second-name"
            class="text-input"
            type="text"
            maxlength="100"
            placeholder="Skriv din makkers navn"
          >

        </label>


        <p
          id="form-error"
          class="form-error"
        ></p>


        <button
          id="submit-booking"
          class="primary-button"
          type="submit"
        >
          Bekræft booking
        </button>

      </form>

    </section>

  </div>



  <!-- SUCCESS -->

  <div
    id="success-toast"
    class="toast"
    hidden
  >
    ✓ Du er skrevet på
  </div>



  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/booking.js?v=3"></script>



  <script>

    let currentEvent = null;

    let stands = [];
    let eventDays = [];
    let shifts = [];
    let bookings = [];

    let selectedDate = null;

    let selectedShift = null;



    /* =====================================
       HELPERS
    ===================================== */

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;
    }



    function formatTime(value) {

      if (!value) {
        return "";
      }

      return value
        .slice(0, 5)
        .replace(":", ".");
    }



    function formatDateParts(value) {

      const date =
        new Date(
          value + "T12:00:00"
        );


      const weekday =
        new Intl.DateTimeFormat(
          "da-DK",
          {
            weekday: "long"
          }
        ).format(date);


      const dateText =
        new Intl.DateTimeFormat(
          "da-DK",
          {
            day: "numeric",
            month: "short"
          }
        ).format(date);


      return {
        weekday,
        dateText
      };
    }



    function getSlug() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("event");
    }



    function getStand(standId) {

      return stands.find(
        stand =>
          stand.id === standId
      );
    }



    function getShiftBookings(shiftId) {

      return bookings.filter(
        booking =>
          booking.shift_id ===
          shiftId
      );
    }



    function getAvailability(shift) {

      const shiftBookings =
        getShiftBookings(
          shift.id
        );


      const remaining =
        shift.capacity
        - shiftBookings.length;


      if (shift.is_closed) {

        return {
          remaining: 0,
          label: "Lukket",
          className: "closed"
        };

      }


      if (remaining <= 0) {

        return {
          remaining: 0,
          label: "Fuldt booket",
          className: "full"
        };

      }


      if (remaining === 1) {

        return {
          remaining: 1,
          label: "1 ledig",
          className: "partial"
        };

      }


      return {
        remaining: 2,
        label: "2 ledige",
        className: "open"
      };
    }



    /* =====================================
       DAY TABS
    ===================================== */

    function renderDayTabs() {

      const container =
        document.querySelector(
          "#day-tabs"
        );


      const dates =
        [
          ...new Set(
            eventDays.map(
              day =>
                day.event_date
            )
          )
        ];


      if (
        !selectedDate &&
        dates.length > 0
      ) {

        selectedDate =
          dates[0];

      }


      container.innerHTML =
        dates
          .map(date => {

            const parts =
              formatDateParts(date);


            return `
              <button
                type="button"
                class="
                  day-tab
                  ${
                    date === selectedDate
                      ? "active"
                      : ""
                  }
                "
                data-date="${date}"
              >

                <span>
                  ${escapeHtml(
                    parts.weekday
                  )}
                </span>

                <strong>
                  ${escapeHtml(
                    parts.dateText
                  )}
                </strong>

              </button>
            `;

          })
          .join("");


      container
        .querySelectorAll(
          ".day-tab"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              selectedDate =
                button.dataset.date;

              renderDayTabs();
              renderSchedule();

            }
          );

        });
    }



    /* =====================================
       PERSON SLOTS
    ===================================== */

    function renderPersonSlots(shift) {

      const shiftBookings =
        getShiftBookings(
          shift.id
        );


      const people = [];


      for (
        let i = 0;
        i < shift.capacity;
        i++
      ) {

        const booking =
          shiftBookings[i];


        if (booking) {

          people.push(`
            <div class="person">
              ${escapeHtml(
                booking.name
              )}
            </div>
          `);

        } else {

          people.push(`
            <div class="person empty">
              Ledig plads
            </div>
          `);

        }

      }


      return people.join("");
    }



    /* =====================================
       SCHEDULE
    ===================================== */

    function renderSchedule() {

      const container =
        document.querySelector(
          "#schedule"
        );


      const selectedDays =
        eventDays.filter(
          day =>
            day.event_date ===
            selectedDate
        );


      const selectedDayIds =
        selectedDays.map(
          day => day.id
        );


      const dayShifts =
        shifts.filter(
          shift =>
            selectedDayIds.includes(
              shift.event_day_id
            )
        );


      if (dayShifts.length === 0) {

        container.innerHTML = `
          <p class="state-message">
            Der er ingen vagter denne dag.
          </p>
        `;

        return;
      }


      const startTimes =
        [
          ...new Set(
            dayShifts.map(
              shift =>
                shift.start_time
            )
          )
        ].sort();


      container.innerHTML =
        startTimes
          .map(startTime => {

            const timeShifts =
              dayShifts.filter(
                shift =>
                  shift.start_time ===
                  startTime
              );


            const firstShift =
              timeShifts[0];


            const timeHeading =
              formatTime(
                firstShift.start_time
              )
              + "–"
              + formatTime(
                firstShift.end_time
              );


            const standHtml =
              timeShifts
                .map(shift => {

                  const stand =
                    getStand(
                      shift.stand_id
                    );


                  if (!stand) {
                    return "";
                  }


                  const availability =
                    getAvailability(
                      shift
                    );


                  const fullClass =
                    availability.remaining === 0
                      ? " stand-card-full"
                      : "";


                  return `
                    <article
                      class="
                        stand-card
                        ${fullClass}
                      "
                    >

                      <div class="stand-top">

                        <div>

                          <h3 class="stand-title">
                            ${escapeHtml(
                              stand.name
                            )}
                          </h3>


                          <p class="stand-address">
                            ${escapeHtml(
                              stand.address
                            )}
                          </p>


                          <a
                            class="map-link"
                            href="${window
                              .StandBookBooking
                              .createMapUrl(
                                stand.address
                              )}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            Se på kort ↗
                          </a>

                        </div>


                        <span
                          class="
                            status
                            ${availability.className}
                          "
                        >
                          ${availability.label}
                        </span>

                      </div>


                      <div class="people">

                        ${renderPersonSlots(
                          shift
                        )}

                      </div>


                      ${
                        availability.remaining > 0

                          ? `
                            <button
                              type="button"
                              class="book-button"
                              data-shift-id="${shift.id}"
                            >
                              ${
                                availability.remaining === 1
                                  ? "Book ledig plads"
                                  : "Vælg tidspunkt"
                              }
                            </button>
                          `

                          : ""
                      }

                    </article>
                  `;

                })
                .join("");


            return `
              <section class="time-group">

                <h2 class="time-heading">
                  ${timeHeading}
                </h2>

                ${standHtml}

              </section>
            `;

          })
          .join("");


      document
        .querySelectorAll(
          ".book-button"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              openBookingModal(
                Number(
                  button.dataset.shiftId
                )
              );

            }
          );

        });
    }



    /* =====================================
       MODAL
    ===================================== */

    function openBookingModal(
      shiftId
    ) {

      selectedShift =
        shifts.find(
          shift =>
            shift.id === shiftId
        );


      if (!selectedShift) {
        return;
      }


      const availability =
        getAvailability(
          selectedShift
        );


      if (
        availability.remaining <= 0
      ) {

        renderSchedule();

        return;
      }


      const stand =
        getStand(
          selectedShift.stand_id
        );


      if (!stand) {
        return;
      }


      document.querySelector(
        "#modal-title"
      ).textContent =
        formatTime(
          selectedShift.start_time
        )
        + "–"
        + formatTime(
          selectedShift.end_time
        );


      document.querySelector(
        "#modal-stand"
      ).textContent =
        stand.name;


      document.querySelector(
        "#modal-address"
      ).textContent =
        stand.address;


      document.querySelector(
        "#modal-map"
      ).href =
        window
          .StandBookBooking
          .createMapUrl(
            stand.address
          );


      document.querySelector(
        "#booking-form"
      ).reset();


      document.querySelector(
        "#second-name-field"
      ).hidden = true;


      document.querySelector(
        "#form-error"
      ).textContent = "";


      /*
        Makker-funktionen vises kun,
        hvis der faktisk er to ledige
        pladser.
      */

      document.querySelector(
        "#partner-option"
      ).hidden =
        availability.remaining < 2;


      document.querySelector(
        "#booking-modal"
      ).hidden = false;


      document.body
        .classList
        .add(
          "modal-open"
        );


      setTimeout(
        () => {

          document.querySelector(
            "#first-name"
          ).focus();

        },
        50
      );
    }



    function closeBookingModal() {

      document.querySelector(
        "#booking-modal"
      ).hidden = true;


      document.body
        .classList
        .remove(
          "modal-open"
        );


      selectedShift = null;


      document.querySelector(
        "#booking-form"
      ).reset();


      document.querySelector(
        "#second-name-field"
      ).hidden = true;


      document.querySelector(
        "#form-error"
      ).textContent = "";
    }



    /* =====================================
       REFRESH BOOKINGS
    ===================================== */

    async function refreshBookings() {

      bookings =
        await window
          .StandBookBooking
          .getPublicBookings(
            currentEvent.id
          );


      renderSchedule();
    }



    /* =====================================
       BOOK
    ===================================== */

    async function submitBooking(
      event
    ) {

      event.preventDefault();


      if (!selectedShift) {
        return;
      }


      const firstName =
        document.querySelector(
          "#first-name"
        ).value.trim();


      const bookBoth =
        document.querySelector(
          "#book-both"
        ).checked;


      const secondName =
        document.querySelector(
          "#second-name"
        ).value.trim();


      const errorElement =
        document.querySelector(
          "#form-error"
        );


      const submitButton =
        document.querySelector(
          "#submit-booking"
        );


      errorElement.textContent = "";


      if (!firstName) {

        errorElement.textContent =
          "Skriv dit navn.";

        return;
      }


      if (
        bookBoth &&
        !secondName
      ) {

        errorElement.textContent =
          "Skriv din makkers navn.";

        return;
      }


      submitButton.disabled = true;

      submitButton.textContent =
        "Booker...";


      try {

        /*
          I næste trin lægger vi
          konfliktadvarslen ind her.

          Selve bookingen virker allerede nu.
        */

        await window
          .StandBookBooking
          .bookShift({

            shiftId:
              selectedShift.id,

            firstName:
              firstName,

            secondName:
              bookBoth
                ? secondName
                : null,

            bookBoth:
              bookBoth

          });


        closeBookingModal();


        await refreshBookings();


        showSuccessToast();


      } catch (error) {

        console.error(error);


        errorElement.textContent =
          error.message
          || "Bookingen kunne ikke gennemføres.";


      } finally {

        submitButton.disabled = false;

        submitButton.textContent =
          "Bekræft booking";

      }
    }



    /* =====================================
       SUCCESS
    ===================================== */

    function showSuccessToast() {

      const toast =
        document.querySelector(
          "#success-toast"
        );


      toast.hidden = false;


      setTimeout(
        () => {

          toast.hidden = true;

        },
        5000
      );
    }



    /* =====================================
       START
    ===================================== */

    async function startBookingPage() {

      const slug =
        getSlug();


      if (!slug) {

        document.querySelector(
          "#loading"
        ).hidden = true;


        const error =
          document.querySelector(
            "#error-message"
          );


        error.textContent =
          "Bookinglinket er ugyldigt.";


        error.hidden = false;

        return;
      }


      try {

        currentEvent =
          await window
            .StandBookBooking
            .getPublicEvent(
              slug
            );


        [
          stands,
          eventDays,
          shifts,
          bookings
        ] =
          await Promise.all([

            window
              .StandBookBooking
              .getPublicStands(
                currentEvent.id
              ),

            window
              .StandBookBooking
              .getPublicEventDays(
                currentEvent.id
              ),

            window
              .StandBookBooking
              .getPublicShifts(
                currentEvent.id
              ),

            window
              .StandBookBooking
              .getPublicBookings(
                currentEvent.id
              )

          ]);


        document.querySelector(
          "#event-title"
        ).textContent =
          currentEvent.title;


        document.querySelector(
          "#event-description"
        ).textContent =
          currentEvent.description
          || "";


        document.querySelector(
          "#loading"
        ).hidden = true;


        document.querySelector(
          "#page"
        ).hidden = false;


        renderDayTabs();

        renderSchedule();


      } catch (error) {

        console.error(error);


        document.querySelector(
          "#loading"
        ).hidden = true;


        const message =
          document.querySelector(
            "#error-message"
          );


        message.textContent =
          "Arrangementet kunne ikke hentes: "
          + error.message;


        message.hidden = false;

      }
    }



    /* =====================================
       EVENTS
    ===================================== */

    document.querySelector(
      "#modal-close"
    ).addEventListener(
      "click",
      closeBookingModal
    );


    document.querySelector(
      "#booking-modal"
    ).addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "booking-modal"
        ) {

          closeBookingModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          !document.querySelector(
            "#booking-modal"
          ).hidden
        ) {

          closeBookingModal();

        }

      }
    );


    document.querySelector(
      "#book-both"
    ).addEventListener(
      "change",
      event => {

        const secondField =
          document.querySelector(
            "#second-name-field"
          );


        const secondInput =
          document.querySelector(
            "#second-name"
          );


        secondField.hidden =
          !event.target.checked;


        secondInput.required =
          event.target.checked;


        if (
          event.target.checked
        ) {

          secondInput.focus();

        } else {

          secondInput.value = "";

        }

      }
    );


    document.querySelector(
      "#booking-form"
    ).addEventListener(
      "submit",
      submitBooking
    );


    startBookingPage();

  </script>

</body>

</html>
