<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Log ind – StandBook</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 420px;
      margin: 80px auto;
      padding: 20px;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    button {
      cursor: pointer;
    }

    #message {
      min-height: 24px;
    }
  </style>
</head>

<body>

  <h1>StandBook</h1>
  <h2>Administration</h2>

  <form id="login-form">

    <label for="email">
      E-mail
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      required
    >


    <label for="password">
      Adgangskode
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >


    <button type="submit" id="login-button">
      Log ind
    </button>

  </form>

  <p id="message"></p>


  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <!-- StandBook -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>


  <script>
    const form =
      document.querySelector("#login-form");

    const message =
      document.querySelector("#message");

    const button =
      document.querySelector("#login-button");


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.textContent =
          "Logger ind...";

        button.disabled = true;


        const email =
          document.querySelector("#email").value;

        const password =
          document.querySelector("#password").value;


        try {

          await window.StandBookAuth.login(
            email,
            password
          );

          message.textContent =
            "✓ Login lykkedes";

          window.location.href =
            "admin.html";

        } catch (error) {

          console.error(error);

          message.textContent =
            "Kunne ikke logge ind: "
            + error.message;

          button.disabled = false;
        }
      }
    );
  </script>

</body>
</html>
